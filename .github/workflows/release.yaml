name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'appimagetool version number, or "continuous"'
        required: true
      revision:
        description: 'Upstream commit the continuous build must match (continuous only)'
        required: false

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  REPOSITORY: appimagetool

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-slim
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.value }}
      is_latest: ${{ steps.version.outputs.is_latest }}
      revision: ${{ steps.version.outputs.revision }}
      date: ${{ steps.version.outputs.date }}
      digests: ${{ steps.version.outputs.digests }}
    steps:
      - name: Resolve version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REVISION: ${{ inputs.revision }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="$GITHUB_REF_NAME"
          else
            version="$INPUT_VERSION"
          fi
          release=$(gh api "repos/AppImage/appimagetool/releases/tags/$version")
          if [ "$version" = "continuous" ]; then
            if [ -z "$INPUT_REVISION" ]; then
              echo "::error::revision input is required for continuous builds"
              exit 1
            fi
            if [ "$(jq -r .target_commitish <<<"$release")" != "$INPUT_REVISION" ]; then
              echo "::error::continuous moved past $INPUT_REVISION since dispatch; the next check will pick up the new build"
              exit 1
            fi
            echo "is_latest=false" >> $GITHUB_OUTPUT
            echo "revision=$INPUT_REVISION" >> $GITHUB_OUTPUT
            echo "date=$(date -u -d "$(jq -r .published_at <<<"$release")" +%y%m%d)" >> $GITHUB_OUTPUT
          else
            highest=$(gh api "repos/${{ github.repository }}/tags" --paginate --jq '.[].name | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' | sort -V | tail -1)
            if [ -z "$highest" ] || [ "$(printf '%s\n%s\n' "$highest" "$version" | sort -V | tail -1)" = "$version" ]; then
              echo "is_latest=true" >> $GITHUB_OUTPUT
            else
              echo "is_latest=false" >> $GITHUB_OUTPUT
            fi
          fi
          digests=$(jq -c '[.assets[]
            | select(.name | test("^appimagetool-(x86_64|aarch64|armhf|i686)\\.AppImage$"))
            | select(.digest != null)
            | {key: (.name | capture("^appimagetool-(?<arch>.+)\\.AppImage$").arch), value: (.digest | sub("^sha256:"; ""))}]
            | from_entries' <<<"$release")
          count=$(jq length <<<"$digests")
          if [ "$count" -eq 0 ] && [ "$version" != "continuous" ]; then
            echo "::warning::$version publishes no asset digests; building without checksum verification"
          elif [ "$count" -ne 4 ]; then
            echo "::error::expected 4 assets with digests in $version, got: $digests"
            exit 1
          fi
          echo "digests=$digests" >> $GITHUB_OUTPUT
          echo "value=$version" >> $GITHUB_OUTPUT

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64,  runner: ubuntu-latest,    qemu: false, asset: x86_64  }
          - { platform: linux/arm64,  runner: ubuntu-24.04-arm, qemu: false, asset: aarch64 }
          - { platform: linux/arm/v7, runner: ubuntu-latest,    qemu: true,  asset: armhf   }
          - { platform: linux/386,    runner: ubuntu-latest,    qemu: true,  asset: i686    }
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        if: matrix.qemu
        uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            APPIMAGETOOL_VERSION=${{ needs.resolve-version.outputs.version }}
            APPIMAGETOOL_SHA256=${{ fromJSON(needs.resolve-version.outputs.digests)[matrix.asset] }}
          outputs: type=image,name=ghcr.io/its-me/${{ env.REPOSITORY }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  assemble:
    name: Assemble in GHCR
    needs: [resolve-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tags: ${{ steps.tags.outputs.list }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Resolve tags
        id: tags
        env:
          VERSION: ${{ needs.resolve-version.outputs.version }}
          IS_LATEST: ${{ needs.resolve-version.outputs.is_latest }}
          REVISION: ${{ needs.resolve-version.outputs.revision }}
          DATE: ${{ needs.resolve-version.outputs.date }}
        run: |
          # sha7 and date tags are for continuous builds only; semver
          # releases get just their version (plus latest when highest)
          if [ "$VERSION" = "continuous" ]; then
            tags="continuous ${REVISION::7} $DATE"
          else
            tags="$VERSION"
            if [ "$IS_LATEST" = "true" ]; then
              tags="$tags latest"
            fi
          fi
          echo "list=$tags" >> $GITHUB_OUTPUT

      - name: Create manifest
        env:
          TAGS: ${{ steps.tags.outputs.list }}
          REVISION: ${{ needs.resolve-version.outputs.revision }}
        run: |
          annotations=()
          if [ -n "$REVISION" ]; then
            annotations=(--annotation "index:org.opencontainers.image.revision=$REVISION")
          fi
          for tag in $TAGS; do
            docker buildx imagetools create \
              "${annotations[@]}" \
              --tag ghcr.io/its-me/$REPOSITORY:$tag \
              $(printf "ghcr.io/its-me/$REPOSITORY@sha256:%s " $(ls /tmp/digests))
          done

  push-hub:
    name: Deploy to Docker Hub
    needs: assemble
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: ${{ secrets.HUB_USERNAME }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.HUB_USERNAME }}
          destination-password: ${{ secrets.HUB_TOKEN }}
          tags: ${{ needs.assemble.outputs.tags }}

  push-quay:
    name: Deploy to Quay.io
    needs: assemble
    runs-on: ubuntu-slim
    permissions:
      packages: read
    steps:
      - name: Resolve Quay namespace
        id: namespace
        env:
          QUAY_NAMESPACE: ${{ secrets.QUAY_USERNAME }}
        run: echo "value=${QUAY_NAMESPACE%%+*}" >> "$GITHUB_OUTPUT"

      - uses: its-me/action.image.mirror@v1
        with:
          source: ghcr.io/its-me/${{ env.REPOSITORY }}
          source-username: ${{ github.actor }}
          source-password: ${{ secrets.GITHUB_TOKEN }}
          destination: quay.io/${{ steps.namespace.outputs.value }}/${{ env.REPOSITORY }}
          destination-username: ${{ secrets.QUAY_USERNAME }}
          destination-password: ${{ secrets.QUAY_TOKEN }}
          tags: ${{ needs.assemble.outputs.tags }}
