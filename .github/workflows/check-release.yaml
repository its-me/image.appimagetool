name: Check for new release

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check:
    name: Check for missed releases
    runs-on: ubuntu-slim
    permissions:
      contents: read
      actions: write
      packages: read
    steps:
      # Dispatches the Release workflow for every stable semver upstream release
      # that has no tag in this repository yet. Only versions at or above the
      # oldest existing tag are considered, so ancient upstream history is not
      # built. The Release workflow creates the repository tag once it
      # succeeds, so a failed release is retried on the next run.
      - name: Dispatch missed releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name')
          upstream=$(gh api repos/AppImage/appimagetool/releases --paginate \
            --jq '.[] | select((.draft or .prerelease) | not) | .tag_name' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V || true)
          floor=$(grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' <<<"$existing" | sort -V | head -1 || true)

          if [ -z "$floor" ]; then
            upstream=$(tail -1 <<<"$upstream")
          fi

          for version in $upstream; do
            if [ -n "$floor" ] && [ "$(printf '%s\n%s\n' "$floor" "$version" | sort -V | head -1)" != "$floor" ]; then
              continue
            fi
            if grep -qxF "$version" <<<"$existing"; then
              continue
            fi
            echo "Dispatching release for $version"
            gh workflow run release.yaml -f version="$version"
          done

      - name: Check continuous build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          release=$(gh api repos/AppImage/appimagetool/releases/tags/continuous)
          sha=$(jq -r .target_commitish <<<"$release")
          count=$(jq '[.assets[]
            | select(.name | test("^appimagetool-(x86_64|aarch64|armhf|i686)\\.AppImage$"))
            | select(.digest != null)] | length' <<<"$release")
          if [ "$count" -ne 4 ]; then
            echo "continuous release at $sha is incomplete ($count/4 assets); retrying next run"
            exit 0
          fi

          token=$(curl -fsSL -u "$GH_ACTOR:$GH_TOKEN" \
            "https://ghcr.io/token?scope=repository:its-me/appimagetool:pull" | jq -r .token)
          manifest="$RUNNER_TEMP/continuous.json"
          code=$(curl -sS -o "$manifest" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json" \
            https://ghcr.io/v2/its-me/appimagetool/manifests/continuous)
          case "$code" in
            200) published=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' "$manifest") ;;
            404) published="" ;;
            *) echo "::error::GHCR manifest lookup failed with HTTP $code"; exit 1 ;;
          esac

          if [ "$published" != "$sha" ]; then
            echo "continuous: published ${published:-none}, upstream $sha; dispatching build"
            gh workflow run release.yaml -f version=continuous -f revision="$sha"
          fi
